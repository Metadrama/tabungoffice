spring.jpa.show-sql=true
spring.datasource.url=jdbc:h2:file:./data/tabungoffice
logging.file.name=target/app.log
server.error.include-message=always

#by default in-memory h2 resets on every exit()
#so ddl-auto creates missing tables at startup ensuring the DB intact

spring.jpa.hibernate.ddl-auto=update
