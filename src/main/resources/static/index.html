<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Tabung Office</title>
</head>

<body>

  <h2>Register</h2>
  <input id="rName" placeholder="name">
  <input id="rEmail" placeholder="email">
  <input id="rPhone" placeholder="phone">
  <input id="rPass" placeholder="password">
  <button onclick="register()">register</button>

  <h2>Login</h2>
  <input id="lPhone" placeholder="phone">
  <input id="lPass" placeholder="password">
  <button onclick="login()">login</button>

  <p id="msg"></p>

  <h2>Users</h2>
  <button onclick="loadUsers()">load</button>
  <table border="1" cellpadding="4">
    <tr>
      <th>id</th>
      <th>name</th>
      <th>email</th>
      <th>phone</th>
    </tr>
    <tbody id="rows"></tbody>
  </table>

  <script>
    function say(t) {
      document.getElementById('msg').textContent = t;
    }

    function post(url, body) {
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function (res) { return res.json(); });
    }

    function register() {
      fetch('/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          displayName: document.getElementById('rName').value,
          email: document.getElementById('rEmail').value,
          phone: document.getElementById('rPhone').value,
          password: document.getElementById('rPass').value
        })
      }).then(function (res) {
        if (res.status === 409) {
          say('that phone number is already registered');
          return;
        }
        return res.json().then(function (user) {
          say('registered ' + user.displayName + ' id ' + user.id);
          loadUsers();
        });
      });
    }

    function login() {
      post('/login', {
        phone: document.getElementById('lPhone').value,
        password: document.getElementById('lPass').value
      }).then(function (ok) {
        say(ok ? 'login ok' : 'wrong phone or password');
      });
    }

    function loadUsers() {
      fetch('/list_users')
        .then(function (res) { return res.json(); })
        .then(function (users) {
          var rows = document.getElementById('rows');
          rows.innerHTML = '';
          users.forEach(function (u) {
            var tr = document.createElement('tr');
            [u.id, u.displayName, u.email, u.phone].forEach(function (v) {
              var td = document.createElement('td');
              td.textContent = v;
              tr.appendChild(td);
            });
            rows.appendChild(tr);
          });
        });
    }

    loadUsers();
  </script>

</body>

</html>
