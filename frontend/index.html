<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Tabung Office</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/98.css@0.1.20/dist/98.min.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #c0c0c0;
        }

        .window {
            width: 560px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .authpair {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .authpair fieldset {
            flex: 1;
            margin: 0;
        }

        label {
            display: block;
            margin-top: 6px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }

        fieldset {
            min-width: 0;
        }

        .formrow {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: flex-end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .formrow > button {
            margin-left: auto;
        }

        .formrow .field input {
            width: 100%;
        }

        .scroll {
            max-height: 190px;
            overflow: auto;
            margin-top: 6px;
        }

        table {
            width: 100%;
        }

        .signedIn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .status-bar {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">Tabung Office</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
            </div>
        </div>

        <div class="window-body">

            <div id="authSection">
                <div class="authpair">
                    <fieldset>
                        <legend>Register</legend>
                        <label for="regName">Name</label>
                        <input type="text" id="regName">
                        <label for="regPhone">Phone</label>
                        <input type="text" id="regPhone">
                        <label for="regPass">Password</label>
                        <input type="password" id="regPass">
                        <label for="regPass2">Password again</label>
                        <input type="password" id="regPass2">
                        <div class="actions">
                            <button onclick="register()">register</button>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Login</legend>
                        <label for="loginPhone">Phone</label>
                        <input type="text" id="loginPhone">
                        <label for="loginPass">Password</label>
                        <input type="password" id="loginPass">
                        <div class="actions">
                            <button onclick="login()">login</button>
                        </div>
                    </fieldset>
                </div>
            </div>

            <div id="appSection" style="display:none">

                <div class="signedIn">
                    <span>Signed in as <strong id="whoami"></strong></span>
                    <button onclick="logout()">log out</button>
                </div>

                <fieldset>
                    <legend>Office Tabungs</legend>
                    <button onclick="loadTabungs()">refresh</button>
                    <div class="scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th>tabung id</th>
                                    <th>name</th>
                                    <th>target</th>
                                    <th>collected</th>
                                    <th>members</th>
                                    <th>event</th>
                                    <th>started by</th>
                                </tr>
                            </thead>
                            <tbody id="tabungRows"></tbody>
                        </table>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>New Tabung</legend>
                    <div class="formrow">
                        <div class="field">
                            <label for="tName">Name</label>
                            <input type="text" id="tName">
                        </div>
                        <div class="field">
                            <label for="tTarget">Target</label>
                            <input type="number" id="tTarget">
                        </div>
                        <div class="field">
                            <label for="tDate">Event date</label>
                            <input type="date" id="tDate">
                        </div>
                        <button onclick="createTabung()">create</button>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Contributions</legend>
                    <div class="formrow">
                        <div class="field">
                            <label for="cListId">Tabung id</label>
                            <input type="number" id="cListId">
                        </div>
                        <button onclick="loadContributions()">load</button>
                    </div>
                    <div class="scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th>contribution id</th>
                                    <th>member</th>
                                    <th>amount</th>
                                    <th>note</th>
                                </tr>
                            </thead>
                            <tbody id="contribRows"></tbody>
                        </table>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Add Contribution</legend>
                    <div class="formrow">
                        <div class="field">
                            <label for="cTabungId">Tabung id</label>
                            <input type="number" id="cTabungId">
                        </div>
                        <div class="field">
                            <label for="cName">Member name</label>
                            <input type="text" id="cName">
                        </div>
                        <div class="field">
                            <label for="cAmount">Amount</label>
                            <input type="number" id="cAmount">
                        </div>
                        <div class="field">
                            <label for="cNote">Note</label>
                            <input type="text" id="cNote">
                        </div>
                        <button onclick="addContribution()">add</button>
                    </div>
                </fieldset>

            </div>

        </div>

        <div class="status-bar">
            <p class="status-bar-field" id="msg"></p>
        </div>
    </div>

<script>
var API = 'http://localhost:8080';
var myPhone = '';

function say(t) {
  document.getElementById('msg').textContent = t;
}

function post(url, body) {
  return fetch(API + url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
}

function register() {
  var pass = document.getElementById('regPass').value;
  var pass2 = document.getElementById('regPass2').value;
  if (pass !== pass2) {
    say('the two passwords do not match');
    return;
  }
  if (pass.length < 6) {
    say('password needs at least 6 characters');
    return;
  }
  post('/register', {
    displayName: document.getElementById('regName').value,
    phone: document.getElementById('regPhone').value,
    password: pass
  }).then(function (res) {
    if (res.status === 409) {
      say('that phone number is already registered');
      return;
    }
    return res.json().then(function (user) {
      say('registered ' + user.displayName + '. now log in with your phone.');
    });
  });
}

function login() {
  var phone = document.getElementById('loginPhone').value;
  post('/login', {
    phone: phone,
    password: document.getElementById('loginPass').value
  }).then(function (res) { return res.json(); })
    .then(function (ok) {
      if (!ok) {
        say('wrong phone or password');
        return;
      }
      myPhone = phone;
      showApp();
      say('');
      loadTabungs();
    });
}

function showApp() {
  document.getElementById('authSection').style.display = 'none';
  document.getElementById('appSection').style.display = 'block';
  document.getElementById('whoami').textContent = myPhone;
}

function logout() {
  myPhone = '';
  document.getElementById('appSection').style.display = 'none';
  document.getElementById('authSection').style.display = 'block';
  document.getElementById('tabungRows').innerHTML = '';
  document.getElementById('contribRows').innerHTML = '';
  say('logged out');
}

function createTabung() {
  post('/tabungs?ownerPhone=' + encodeURIComponent(myPhone), {
    name: document.getElementById('tName').value,
    targetAmount: Number(document.getElementById('tTarget').value),
    eventDate: document.getElementById('tDate').value
  }).then(function (res) {
    if (!res.ok) {
      say('could not create tabung, check the fields');
      return;
    }
    say('tabung created');
    loadTabungs();
  });
}

function loadTabungs() {
  // no ownerPhone filter: a tabung is an office collection, everyone sees all of them
  fetch(API + '/tabungs')
    .then(function (res) { return res.json(); })
    .then(function (list) {
      var rows = document.getElementById('tabungRows');
      rows.innerHTML = '';
      if (list.length === 0) {
        say('no tabungs yet, create one above');
        return;
      }
      list.forEach(function (t) {
        var tr = document.createElement('tr');
        [t.id, t.name, t.targetAmount, '', '', t.eventDate, t.ownerPhone].forEach(function (v) {
          var td = document.createElement('td');
          td.textContent = v === null ? '' : v;
          tr.appendChild(td);
        });
        rows.appendChild(tr);
        fillProgress(t.id);
      });
    });
}

function fillProgress(id) {
  fetch(API + '/tabungs/' + id)
    .then(function (res) { return res.json(); })
    .then(function (s) {
      var rows = document.getElementById('tabungRows');
      for (var i = 0; i < rows.children.length; i++) {
        var cells = rows.children[i].children;
        if (String(cells[0].textContent) === String(id)) {
          cells[3].textContent = s.collected;
          cells[4].textContent = s.memberCount;
        }
      }
    });
}

function addContribution() {
  var id = document.getElementById('cTabungId').value;
  if (!id) {
    say('type the tabung id first');
    return;
  }
  post('/tabungs/' + id + '/contributions', {
    memberName: document.getElementById('cName').value,
    amount: Number(document.getElementById('cAmount').value),
    note: document.getElementById('cNote').value
  }).then(function (res) {
    if (res.status === 404) {
      say('no tabung with that id');
      return;
    }
    say('contribution added');
    loadTabungs();
  });
}

function loadContributions() {
  var id = document.getElementById('cListId').value;
  if (!id) {
    say('type the tabung id first');
    return;
  }
  fetch(API + '/tabungs/' + id + '/contributions')
    .then(function (res) { return res.json(); })
    .then(function (list) {
      var rows = document.getElementById('contribRows');
      rows.innerHTML = '';
      if (list.length === 0) {
        say('nobody has contributed to that tabung yet');
        return;
      }
      list.forEach(function (c) {
        var tr = document.createElement('tr');
        [c.id, c.memberName, c.amount, c.note].forEach(function (v) {
          var td = document.createElement('td');
          td.textContent = v === null ? '' : v;
          tr.appendChild(td);
        });
        rows.appendChild(tr);
      });
    });
}
</script>

</body>

</html>
